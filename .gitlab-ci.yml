stages:
  - lint
  - test
  - build
  - deploy

lint:
  stage: lint
  image: python:3.12
  script:
    - pip install flake8
    - flake8 .

test:
  stage: test
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - pytest

build:
  stage: build
  script:
    - echo "Building Docker image"
    - echo "Pushing image to GitLab Container Registry"

deploy:
  stage: deploy
  only:
    - main
  script:
    - echo "Deploying scraper to AWS ECS"
